<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="mb-mal.ico">
    <title>MangaBaka to MAL Sync</title>
    <script src="https://unpkg.com/fflate"></script>
    <style>
        body { background: #151515; color: #ddd; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { width: 100%; max-width: 500px; border: 1px solid #444; padding: 24px; box-sizing: border-box; }
        h2 { margin: 0 0 20px; font-size: 20px; font-weight: normal; }

        .links { margin-bottom: 20px; }
        .links a { color: #aaa; font-size: 13px; margin-right: 16px; }
        .links a:hover { color: #fff; }

        .label { display: block; font-size: 12px; color: #999; margin-bottom: 4px; }
        .row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
        input[type="file"] { flex: 1; min-width: 0; font-size: 12px; color: #aaa; }
        input[type="file"]::file-selector-button { background: #2a2a2a; color: #ddd; border: 1px solid #555; border-radius: 0; padding: 6px 10px; margin-right: 10px; cursor: pointer; }

        button { background: #2a2a2a; color: #ddd; border: 1px solid #555; border-radius: 0; padding: 8px 14px; font-size: 14px; cursor: pointer; }
        button:hover { background: #3a3a3a; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #authBtn, #mbAuthBtn { white-space: nowrap; }
        button.needs-auth { background: #eee; color: #000; border-color: #eee; font-weight: bold; }
        #syncBtn { width: 100%; padding: 12px; }

        #sessionInfo, #mbSessionInfo { display: none; justify-content: space-between; font-size: 12px; color: #999; margin: -8px 0 16px; }
        #sessionInfo a, #mbSessionInfo a { color: #999; }

        #previewContainer { display: none; border: 1px solid #444; margin-bottom: 16px; }
        summary { cursor: pointer; padding: 8px 10px; }
        #changeList { padding: 0 10px 10px; max-height: 200px; overflow-y: auto; font-size: 12px; color: #aaa; }
        .change-item { padding: 8px 0; border-bottom: 1px solid #333; }
        .change-title { font-size: 13px; color: #eee; }
        .change-diff { margin-top: 3px; }

        #logBox { display: none; margin-top: 16px; border: 1px solid #444; padding: 10px; height: 140px; overflow-y: auto; font-family: Consolas, monospace; font-size: 11px; line-height: 1.4; color: #ccc; }
        .log-error { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>MangaBaka to MAL Sync</h2>

        <div class="links">
            <a href="https://mangabaka.org/my/library/export/mal" target="_blank">Export Baka</a>
            <a href="https://myanimelist.net/panel.php?go=export" target="_blank">Export MAL</a>
        </div>

        <label class="label" for="bakaFile">MangaBaka XML</label>
        <div class="row">
            <input type="file" id="bakaFile" accept=".xml">
            <button id="mbAuthBtn">Authorize</button>
        </div>

        <div id="mbSessionInfo">
            <span>Token expires in: <span id="mbExpireTimer">...</span></span>
            <a href="#" id="mbResetBtn">Reset Token</a>
        </div>

        <label class="label" for="malFile">MAL XML (.gz supported)</label>
        <div class="row">
            <input type="file" id="malFile" accept=".xml,.gz">
            <button id="authBtn">Authorize</button>
        </div>

        <div id="sessionInfo">
            <span>Token expires in: <span id="expireTimer">...</span></span>
            <a href="#" id="resetBtn">Reset Token</a>
        </div>

        <div id="previewContainer">
            <details open>
                <summary>Changes (<span id="changeCount">0</span>)</summary>
                <div id="changeList"></div>
            </details>
        </div>

        <button id="syncBtn">Sync Lists</button>

        <div id="logBox"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
